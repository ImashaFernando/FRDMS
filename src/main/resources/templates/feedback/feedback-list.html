
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Feedback | FRDMS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #EDF3F6;
            color: #1F3A60;
        }

        header {
            background: #1F3A60;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            color: #D8E7F0;
            line-height: 1.6;
        }

        .container {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .feedback-card {
            background: white;
            border: 1px solid #E0EAF0;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(31, 58, 96, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .name {
            font-size: 19px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .rating {
            color: #E6B82E;
            font-size: 22px;
            white-space: nowrap;
        }

        .rating-number {
            color: #718496;
            font-size: 13px;
            margin-left: 5px;
        }

        .feedback-text {
            margin: 0;
            padding-top: 16px;
            border-top: 1px solid #E2EAF0;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #42566B;
        }

        .empty-state {
            background: white;
            border-radius: 14px;
            padding: 55px 20px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(31, 58, 96, 0.06);
        }

        .empty-state h2 {
            margin-top: 0;
        }

        .empty-state p {
            color: #718496;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            header {
                padding: 25px 18px;
            }

            .feedback-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Community Feedback</h1>
    <p>Read feedback shared by our community about relief assistance and activities.</p>
</header>

<main class="container">

    <div class="feedback-grid"
         th:if="${feedbackList != null and !#lists.isEmpty(feedbackList)}">

        <article class="feedback-card"
                 th:each="feedback : ${feedbackList}">

            <div class="card-header">
                <div class="name"
                     th:text="${feedback.name}">
                    User Name
                </div>

                <div>
                    <span class="rating"
                          th:each="star : ${#numbers.sequence(1, 5)}"
                          th:text="${star <= feedback.rating ? '★' : '☆'}">
                        ★
                    </span>

                    <span class="rating-number"
                          th:text="${feedback.rating + '/5'}">
                        5/5
                    </span>
                </div>
            </div>

            <p class="feedback-text"
               th:text="${feedback.comments}">
                Feedback comments will appear here.
            </p>

        </article>

    </div>

    <div class="empty-state"
         th:if="${feedbackList == null or #lists.isEmpty(feedbackList)}">

        <h2>No Approved Feedback Yet</h2>

        <p>
            Approved community feedback will appear here once the
            Project Manager has reviewed and accepted submissions.
        </p>

    </div>

</main>

</body>
</html>
