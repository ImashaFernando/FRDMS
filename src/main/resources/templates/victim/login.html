<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Victim Login | FRDMS</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
              "Segoe UI",
              Arial,
              sans-serif;

      background:
              linear-gradient(
                      135deg,
                      #eaf4ff,
                      #f7fbff,
                      #e9f7f4
              );

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 30px;

      color: #18324d;
    }


    /* =====================================================
       LOGIN CARD
       ===================================================== */

    .login-container {

      width: 100%;

      max-width: 460px;

      background: white;

      border-radius: 24px;

      padding: 42px;

      box-shadow:
              0 20px 60px
              rgba(35, 72, 110, 0.15);

      border:
              1px solid
              rgba(36, 139, 224, 0.10);

      position: relative;

      overflow: hidden;
    }


    .login-container::before {

      content: "";

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 6px;

      background:
              linear-gradient(
                      90deg,
                      #248be0,
                      #2aa7a0,
                      #248be0
              );
    }


    /* =====================================================
       LOGO
       ===================================================== */

    .logo {

      text-align: center;

      margin-bottom: 28px;
    }


    .logo-icon {

      width: 72px;

      height: 72px;

      margin:
              0 auto 15px;

      border-radius: 20px;

      background:
              linear-gradient(
                      135deg,
                      #248be0,
                      #176fb8
              );

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 34px;

      box-shadow:
              0 10px 25px
              rgba(36, 139, 224, 0.25);
    }


    .logo h1 {

      color: #183b63;

      font-size: 30px;

      font-weight: 800;

      letter-spacing: 1px;
    }


    .logo p {

      margin-top: 6px;

      color: #718395;

      font-size: 13px;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    .title {

      text-align: center;

      font-size: 25px;

      margin-bottom: 25px;

      color: #183b63;
    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error-message {

      background: #fff1f1;

      color: #b42318;

      border:
              1px solid
              #f3b5b5;

      padding: 13px 15px;

      border-radius: 12px;

      margin-bottom: 22px;

      text-align: center;

      font-size: 14px;

      font-weight: 600;
    }


    /* =====================================================
       FORM
       ===================================================== */

    .form-group {

      margin-bottom: 20px;
    }


    .form-group label {

      display: block;

      margin-bottom: 8px;

      color: #34536f;

      font-size: 14px;

      font-weight: 700;
    }


    .form-group input {

      width: 100%;

      padding: 14px 15px;

      border:
              1px solid
              #d5e0ea;

      border-radius: 12px;

      font-size: 15px;

      color: #18324d;

      background: #fbfdff;

      transition: 0.2s;
    }


    .form-group input:focus {

      outline: none;

      border-color: #248be0;

      background: white;

      box-shadow:
              0 0 0 4px
              rgba(36, 139, 224, 0.10);
    }


    /* =====================================================
       LOGIN BUTTON
       ===================================================== */

    .login-btn {

      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background:
              linear-gradient(
                      135deg,
                      #248be0,
                      #176fb8
              );

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
              transform 0.2s,
              box-shadow 0.2s;
    }


    .login-btn:hover {

      transform:
              translateY(-2px);

      box-shadow:
              0 10px 25px
              rgba(36, 139, 224, 0.25);
    }


    /* =====================================================
       REGISTRATION
       ===================================================== */

    .register-link {

      text-align: center;

      margin-top: 24px;

      color: #718395;

      font-size: 14px;
    }


    .register-link a {

      color: #248be0;

      font-weight: 700;

      text-decoration: none;
    }


    .register-link a:hover {

      text-decoration: underline;
    }


    /* =====================================================
       BACK LINK
       ===================================================== */

    .back-link {

      display: block;

      text-align: center;

      margin-top: 18px;

      color: #718395;

      text-decoration: none;

      font-size: 14px;
    }


    .back-link:hover {

      color: #248be0;
    }


    /* =====================================================
       LOGIN INFORMATION
       ===================================================== */

    .login-info {

      margin-top: 25px;

      padding: 14px;

      background: #f2f8fd;

      border-radius: 12px;

      text-align: center;

      color: #60758a;

      font-size: 13px;

      line-height: 1.5;
    }


    .login-info strong {

      color: #248be0;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 18px;
      }

      .login-container {
        padding: 30px 24px;
        border-radius: 20px;
      }

      .logo h1 {
        font-size: 26px;
      }

      .title {
        font-size: 22px;
      }
    }

  </style>

</head>


<body>


<div class="login-container">


  <!-- =====================================================
       LOGO
       ===================================================== -->

  <div class="logo">

    <div class="logo-icon">
      🌊
    </div>

    <h1>
      FRDMS
    </h1>

    <p>
      Flood Relief & Disaster Management System
    </p>

  </div>


  <!-- =====================================================
       TITLE
       ===================================================== -->

  <h2 class="title">
    Victim Login
  </h2>


  <!-- =====================================================
       LOGIN ERROR
       ===================================================== -->

  <div
          th:if="${loginError}"
          class="error-message"
          th:text="${loginError}">
  </div>


  <!-- =====================================================
       LOGIN FORM
       ===================================================== -->

  <form
          th:action="@{/victims/login}"
          method="post">


    <!-- =================================================
         NIC NUMBER
         ================================================= -->

    <div class="form-group">

      <label for="nicNumber">
        NIC Number
      </label>

      <input
              type="text"
              id="nicNumber"
              name="nicNumber"
              placeholder="Enter your NIC number"
              autocomplete="username"
              required
      >

    </div>


    <!-- =================================================
         PASSWORD
         ================================================= -->

    <div class="form-group">

      <label for="password">
        Password
      </label>

      <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
      >

    </div>


    <!-- =================================================
         LOGIN BUTTON
         ================================================= -->

    <button
            type="submit"
            class="login-btn">

      🔐 Login to Victim Account

    </button>

  </form>


  <!-- =====================================================
       LOGIN INFORMATION
       ===================================================== -->

  <div class="login-info">

    Your <strong>NIC number</strong> is used as your
    login identifier.

    <br>

    Enter the password you created during registration.

  </div>


  <!-- =====================================================
       REGISTRATION
       ===================================================== -->

  <div class="register-link">

    Don't have an account?

    <a th:href="@{/victims/register}">
      Register as a Victim
    </a>

  </div>


  <!-- =====================================================
       HOME
       ===================================================== -->

  <a
          href="/"
          class="back-link">

    ← Back to Home

  </a>


</div>


</body>

</html>
