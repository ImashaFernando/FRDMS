<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Project Manager Dashboard - FRDMS</title>

  <link rel="stylesheet"
        th:href="@{/css/chamya-theme.css}">

  <style>
    .dashboard-card {
      width: 100%;
      max-width: 900px;
    }

    .management-section {
      margin-top: 30px;
    }

    .management-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .management-card {
      display: block;
      padding: 25px;
      border-radius: 14px;
      background: #EDF3F6;
      border: 1px solid #D5E1E8;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .management-card h3 {
      margin: 0 0 10px;
      color: #1F3A60;
    }

    .management-card p {
      margin: 0;
      color: #667788;
      line-height: 1.5;
    }

    .management-card.active {
      background: linear-gradient(
              135deg,
              #1F3A60,
              #3582B8
      );
    }

    .management-card.active h3,
    .management-card.active p {
      color: white;
    }

    .management-card.active:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(31, 58, 96, 0.25);
    }

    .logout-section {
      margin-top: 30px;
    }

    @media (max-width: 700px) {
      .management-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<body>

<div class="page-wrapper">

  <div class="card dashboard-card">

    <h2 class="page-title">
      Project Manager Dashboard
    </h2>

    <p class="page-subtitle">
      Flood Relief and Disaster Management System
    </p>

    <div class="info-box">

      Logged in as:

      <strong th:text="${projectManagerEmail}">
        projectmanager@example.com
      </strong>

    </div>


    <div class="management-section">

      <h3>
        Management Modules
      </h3>

      <div class="management-grid">

        <!-- Volunteer Management -->
        <a th:href="@{/project-manager/volunteers}"
           class="management-card active">

          <h3>
            Volunteer Management
          </h3>

          <p>
            View submitted volunteer registrations and review volunteer details.
          </p>

        </a>

      </div>

    </div>


    <div class="logout-section">

      <form th:action="@{/project-manager/logout}"
            method="post">

        <button type="submit"
                class="btn">

          Logout

        </button>

      </form>

    </div>

  </div>

</div>

</body>

</html>
