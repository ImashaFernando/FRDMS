<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Project Manager Login - FRDMS</title>

  <link rel="stylesheet"
        th:href="@{/css/chamya-theme.css}">

</head>

<body>

<div class="page-wrapper">

  <div class="card card-small">

    <h2 class="page-title">
      Project Manager Login
    </h2>

    <div class="alert-error"
         th:if="${loginError}"
         th:text="${loginError}">
    </div>

    <div class="alert-success"
         th:if="${logoutMessage}"
         th:text="${logoutMessage}">
    </div>

    <form th:action="@{/project-manager/login}"
          method="post">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter project manager email"
               autocomplete="email"
               required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter password"
               autocomplete="current-password"
               required>

      </div>


      <button type="submit"
              class="btn">

        Login

      </button>

    </form>

  </div>

</div>

</body>

</html>
