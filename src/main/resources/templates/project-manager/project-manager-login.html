<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project Manager Login - FRDMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e6e8e9;
            color: #1b3557;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================= LOGIN CONTAINER ================= */

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 25px;
        }

        /* ================= LOGIN CARD ================= */

        .login-card {
            background: white;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                    0 10px 30px rgba(0, 0, 0, 0.12);

            border-top: 6px solid #558ee0;
        }

        /* ================= HEADER ================= */

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            margin: 0;
            color: #173457;
            font-size: 28px;
        }

        .login-header p {
            margin-top: 10px;
            color: #557080;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ================= ERROR MESSAGE ================= */

        .alert-error {
            background: #fde8e8;
            border: 1px solid #f5b5b5;
            color: #a33a3a;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        /* ================= SUCCESS MESSAGE ================= */

        .alert-success {
            background: #dcefed;
            border: 1px solid #b8dcd8;
            color: #35737a;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #29445e;

            font-weight: bold;

            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cfd8de;

            border-radius: 8px;

            font-size: 15px;

            color: #173457;

            outline: none;
        }

        .form-group input:focus {
            border-color: #558ee0;

            box-shadow:
                    0 0 0 3px rgba(85, 142, 224, 0.12);
        }

        /* ================= LOGIN BUTTON ================= */

        .login-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 9px;

            background: #558ee0;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #3977cc;

            transform: translateY(-1px);
        }

        /* ================= FOOTER ================= */

        .login-footer {
            margin-top: 25px;

            text-align: center;

            color: #557080;

            font-size: 13px;

            line-height: 1.5;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 25px;
            }

            .login-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- ================= HEADER ================= -->

        <div class="login-header">

            <div class="login-icon">
                🌊
            </div>

            <h1>
                Project Manager Login
            </h1>

            <p>
                Flood Relief and Disaster Management System
            </p>

        </div>


        <!-- ================= LOGIN ERROR ================= -->

        <div class="alert-error"
             th:if="${loginError}"
             th:text="${loginError}">
        </div>


        <!-- ================= LOGOUT MESSAGE ================= -->

        <div class="alert-success"
             th:if="${logoutMessage}"
             th:text="${logoutMessage}">
        </div>


        <!-- ================= LOGIN FORM ================= -->

        <form th:action="@{/project-manager/login}"
              method="post">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter project manager email"
                       autocomplete="email"
                       required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       autocomplete="current-password"
                       required>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit"
                    class="login-button">

                Login

            </button>

        </form>


        <!-- ================= FOOTER ================= -->

        <div class="login-footer">

            Authorized Project Manager access only.

        </div>

    </div>

</div>

</body>

</html>
