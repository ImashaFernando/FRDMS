<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Officer Login - FRDMS</title>

    <link rel="stylesheet"
          th:href="@{/css/finance-officer-login.css}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            FR
        </div>

        <h1>
            Finance Officer Login
        </h1>

        <p class="subtitle">
            Flood Relief and Disaster Management System
        </p>


        <!-- Error Message -->

        <div class="message error"
             th:if="${error}"
             th:text="${error}">
        </div>


        <!-- Logout Message -->

        <div class="message success"
             th:if="${message}"
             th:text="${message}">
        </div>


        <!-- Login Form -->

        <form th:action="@{/finance-officer/login}"
              method="post">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

            </div>


            <button type="submit"
                    class="login-button">

                Login

            </button>

        </form>


    </div>

</div>

</body>

</html>
