<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receive Relief Requirement</title>

    <link rel="stylesheet"
          th:href="@{/css/distribution.css}">
</head>

<body>

<div class="page-container">

    <!-- Header -->
    <header class="page-header">
        <div class="header-content">

            <div>
                <span class="header-label">DISTRIBUTION MANAGEMENT</span>
                <h1>Receive Relief Requirement</h1>
                <p>
                    Record relief requirements received from affected
                    victims, areas, or shelters.
                </p>
            </div>

            <div class="header-icon">
                +
            </div>

        </div>
    </header>


    <!-- Main Content -->
    <main class="content-area">

        <div class="form-card">

            <div class="card-title">
                <h2>Requirement Details</h2>
                <p>Enter the required relief item and recipient information.</p>
            </div>


            <form th:action="@{/distribution/requirements/save}"
                  th:object="${reliefRequirement}"
                  method="post"
                  class="requirement-form">


                <!-- Relief Item Name -->
                <div class="form-group">

                    <label for="reliefItemName">
                        Relief Item Name
                        <span class="required">*</span>
                    </label>

                    <input type="text"
                           id="reliefItemName"
                           th:field="*{reliefItemName}"
                           placeholder="e.g. Rice">

                    <p class="error-message"
                       th:if="${#fields.hasErrors('reliefItemName')}"
                       th:errors="*{reliefItemName}">
                    </p>

                </div>


                <!-- Quantity -->
                <div class="form-group">

                    <label for="quantity">
                        Quantity
                        <span class="required">*</span>
                    </label>

                    <input type="number"
                           id="quantity"
                           step="0.01"
                           min="0.01"
                           th:field="*{quantity}"
                           placeholder="e.g. 50">

                    <p class="error-message"
                       th:if="${#fields.hasErrors('quantity')}"
                       th:errors="*{quantity}">
                    </p>

                </div>


                <!-- Unit -->
                <div class="form-group">

                    <label for="unit">
                        Unit
                        <span class="required">*</span>
                    </label>

                    <input type="text"
                           id="unit"
                           th:field="*{unit}"
                           placeholder="e.g. kg, bottles, packets">

                    <p class="error-message"
                       th:if="${#fields.hasErrors('unit')}"
                       th:errors="*{unit}">
                    </p>

                </div>


                <!-- Recipient -->
                <div class="form-group">

                    <label for="recipientName">
                        Recipient / Victim Name
                    </label>

                    <input type="text"
                           id="recipientName"
                           th:field="*{recipientName}"
                           placeholder="e.g. Kamal Perera">

                </div>


                <!-- Affected Area -->
                <div class="form-group">

                    <label for="affectedArea">
                        Affected Area
                    </label>

                    <input type="text"
                           id="affectedArea"
                           th:field="*{affectedArea}"
                           placeholder="e.g. Gampaha">

                </div>


                <!-- Shelter -->
                <div class="form-group">

                    <label for="shelter">
                        Shelter
                    </label>

                    <input type="text"
                           id="shelter"
                           th:field="*{shelter}"
                           placeholder="e.g. Gampaha Central Shelter">

                </div>


                <!-- Buttons -->
                <div class="form-actions">

                    <a th:href="@{/distribution/requirements}"
                       class="secondary-button">
                        View Requirements
                    </a>

                    <button type="submit"
                            class="primary-button">
                        Save Requirement
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="page-footer">
        <p>Flood Relief &amp; Disaster Management System</p>
    </footer>

</div>

</body>
</html>
