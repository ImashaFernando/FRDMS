
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Necessary Relief Items</title>

  <link rel="stylesheet"
        th:href="@{/css/distribution.css}">

  <style>
    .requested-status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 8px;
      background: #e0f2f1;
      color: #00695c;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div class="page-container">

  <div class="requirements-section">

    <!-- Page title and dashboard button -->
    <div class="requirements-title-row">

      <h1>Necessary Relief Items</h1>

      <a class="dashboard-icon-button"
         th:href="@{/distribution/dashboard}"
         title="Back to Dashboard"
         aria-label="Back to Dashboard">

        <svg viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">

          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5.5 9.5V21h13V9.5"></path>
          <path d="M9.5 21v-6h5v6"></path>

        </svg>

      </a>

    </div>

    <!-- Relief supply status -->
    <a th:href="@{/distribution/stock-status}"
       class="relief-supply-status-button">
      📦 Relief Supply Status
    </a>

    <!-- Total item count -->
    <div class="requirements-count">

      Total Item Types:
      <span th:text="${necessaryItems.size()}">0</span>

    </div>

    <!-- Items grouped by disaster -->
    <div th:if="${!#maps.isEmpty(itemsByDisaster)}">

      <div th:each="entry : ${itemsByDisaster}"
           style="margin-bottom: 30px;
                        border-radius: 12px;
                        overflow: hidden;
                        box-shadow: 0 4px 14px rgba(31, 58, 96, 0.12);">

        <!-- Disaster header -->
        <div style="background: linear-gradient(135deg, #1F3A60, #3582B8);
                            color: white;
                            padding: 18px 22px;
                            font-size: 20px;
                            font-weight: 700;">

          🌊 DISASTER:
          <span th:text="${entry.key}">
                        Kelani River Flood
                    </span>

        </div>

        <!-- Relief items table -->
        <table class="requirements-table"
               style="margin: 0;
                              border-radius: 0;
                              box-shadow: none;">

          <thead>
          <tr>
            <th>Relief Item</th>
            <th>Total Required</th>
            <th>Unit</th>
            <th>Action</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="item : ${entry.value}">

            <td th:text="${item.itemName}">
              Rice
            </td>

            <td th:text="${item.totalRequired}">
              100
            </td>

            <td th:text="${item.unit}">
              kg
            </td>

            <td>

              <!-- Show Request button only when not requested -->
              <div th:if="${!requestedItemKeys.contains(
                                item.disasterName + '::' + item.itemName)}">

                <form th:action="@{/distribution/necessary-items/request}"
                      method="post">

                  <input type="hidden"
                         name="disasterName"
                         th:value="${item.disasterName}">

                  <input type="hidden"
                         name="itemName"
                         th:value="${item.itemName}">

                  <input type="hidden"
                         name="quantity"
                         th:value="${item.totalRequired}">

                  <input type="hidden"
                         name="unit"
                         th:value="${item.unit}">

                  <button type="submit"
                          class="request-item-button">
                    Request
                  </button>

                </form>

              </div>

              <!-- Show Requested status when already requested -->
              <div th:if="${requestedItemKeys.contains(
                                item.disasterName + '::' + item.itemName)}">

                                <span class="requested-status">
                                    Requested
                                </span>

              </div>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

    <!-- Empty state -->
    <div th:if="${#maps.isEmpty(itemsByDisaster)}"
         class="no-requirements">

      No necessary relief items found.

    </div>

  </div>

</div>

</body>
</html>
