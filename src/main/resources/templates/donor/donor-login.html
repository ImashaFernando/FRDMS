<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Login | FRDMS</title>

    <link rel="stylesheet" th:href="@{/css/donor-login.css}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            FRDMS
        </div>

        <h1>Donor Login</h1>

        <p class="subtitle">
            Sign in to manage your donations
        </p>

        <div th:if="${error}" class="message error">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${message}" class="message success">
            <span th:text="${message}"></span>
        </div>

        <form th:action="@{/donor/login}" method="post">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a th:href="@{/donors/register}">
                Register as Donor
            </a>
        </div>

    </div>

</div>

</body>
</html>
