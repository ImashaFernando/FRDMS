<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login - FRDMS</title>

    <link rel="stylesheet"
          th:href="@{/css/chamya-theme.css}">
</head>

<body>

<div class="page-wrapper">

    <div class="card card-small">

        <h2 class="page-title">
            Staff Login
        </h2>

        <p class="page-subtitle">
            Shelter Management Access
        </p>

        <div class="alert-error"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
        </div>

        <div class="alert-success"
             th:if="${logoutMessage}"
             th:text="${logoutMessage}">
        </div>

        <form th:action="@{/staff/login}"
              method="post">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter staff email"
                       required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       required>

            </div>

            <button type="submit"
                    class="btn">

                Login

            </button>

        </form>

    </div>

</div>

</body>
</html>
