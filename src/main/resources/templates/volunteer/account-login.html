<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Volunteer Login - FRDMS</title>

  <link rel="stylesheet"
        th:href="@{/css/chamya-theme.css}">

</head>

<body>

<div class="page-wrapper">

  <div class="card card-small">

    <h2 class="page-title">
      Volunteer Login
    </h2>

    <!-- Login Error -->
    <div class="alert-error"
         th:if="${loginError}"
         th:text="${loginError}">
    </div>

    <!-- Logout Success -->
    <div class="alert-success"
         th:if="${logoutMessage}"
         th:text="${logoutMessage}">
    </div>

    <!-- Login Form -->
    <form th:action="@{/volunteer/login}"
          method="post">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email address"
               autocomplete="email"
               pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"
               title="Please enter a valid email address, for example name@gmail.com"
               required>

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               autocomplete="current-password"
               required>

      </div>

      <button type="submit"
              class="btn">

        Login

      </button>

    </form>

    <div class="link-text">

      Don’t have a volunteer account?

      <a th:href="@{/volunteer/register}">
        Register here
      </a>

    </div>

  </div>

</div>

</body>

</html>
