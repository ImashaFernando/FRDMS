<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Flood Event | FRDMS</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #E6E8E9;
      color: #0C1721;
    }

    /* ================= HEADER ================= */

    .header {
      background: #0C1721;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 10px rgba(12, 23, 33, 0.25);
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .module-name {
      font-size: 14px;
      color: #8DB5E8;
    }

    /* ================= MAIN ================= */

    .page {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 35px 40px;
      box-shadow: 0 5px 20px rgba(12, 23, 33, 0.12);
      border-top: 5px solid #248BE0;
    }

    .page-title {
      margin: 0;
      color: #0B2A4A;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 25px;
      color: #28888F;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ================= ROLE BOX ================= */

    .role-box {
      background: #EAF4FB;
      border-left: 5px solid #248BE0;
      padding: 15px 18px;
      border-radius: 7px;
      margin-bottom: 30px;
    }

    .role-title {
      color: #0B2A4A;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .role-text {
      color: #53616A;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ================= SUCCESS ================= */

    .success {
      background: #CFE8F7;
      border-left: 5px solid #28888F;
      color: #0B2A4A;
      padding: 14px 16px;
      border-radius: 6px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    /* ================= SECTION ================= */

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #CFE8F7;
      color: #0B2A4A;
      font-size: 18px;
      font-weight: bold;
    }

    .section-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #28888F;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #0B2A4A;
      font-size: 15px;
      font-weight: bold;
    }

    .required {
      color: #28888F;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #B9BEC1;
      border-radius: 7px;
      background: #ffffff;
      color: #0C1721;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      transition: 0.2s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #248BE0;
      box-shadow: 0 0 0 3px rgba(36, 139, 224, 0.15);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    .help-text {
      margin-top: 6px;
      font-size: 13px;
      color: #6b747a;
      line-height: 1.5;
    }

    /* ================= VALIDATION ================= */

    .error {
      margin-top: 6px;
      color: #b42318;
      font-size: 13px;
      font-weight: 500;
    }

    /* ================= BUTTONS ================= */

    .button-area {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #E6E8E9;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      border: none;
      background: #248BE0;
      color: white;
    }

    .btn-primary:hover {
      background: #0B2A4A;
    }

    .btn-secondary {
      background: #E6E8E9;
      color: #0B2A4A;
      border: 1px solid #B9BEC1;
    }

    .btn-secondary:hover {
      background: #CFE8F7;
      border-color: #8DB5E8;
    }

    /* ================= WORKFLOW BOX ================= */

    .workflow-box {
      margin-top: 30px;
      background: #F5F8FA;
      border: 1px solid #D5DDE2;
      border-radius: 9px;
      padding: 20px;
    }

    .workflow-title {
      color: #0B2A4A;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .workflow-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #53616A;
    }

    .workflow-item:last-child {
      margin-bottom: 0;
    }

    .workflow-badge {
      min-width: 55px;
      padding: 5px 8px;
      text-align: center;
      border-radius: 5px;
      background: #28888F;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .workflow-badge.current {
      background: #248BE0;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 650px) {

      .header {
        padding: 18px 20px;
      }

      .brand {
        font-size: 20px;
      }

      .module-name {
        display: none;
      }

      .page {
        margin: 25px auto;
      }

      .card {
        padding: 25px 20px;
      }

      .page-title {
        font-size: 25px;
      }

      .button-area {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .workflow-item {
        align-items: flex-start;
      }

    }

  </style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="brand">
    Flood Disaster Relief System
  </div>

  <div class="module-name">
    Disaster Management Module
  </div>

</header>


<!-- ================= MAIN ================= -->

<main class="page">

  <div class="card">

    <!-- PAGE TITLE -->

    <h1 class="page-title">
      Create Flood Event
    </h1>


    <!-- ================= SUCCESS ================= -->

    <div
            class="success"
            th:if="${successMessage}"
            th:text="${successMessage}">
    </div>


    <!-- ================= FORM ================= -->

    <form
            th:action="@{/disasters}"
            th:object="${disaster}"
            method="post">


      <!-- ================= DM-01 / DM-02 ================= -->

      <div class="section-title">

                <span class="section-number">
                    1
                </span>

        Flood Event Information

      </div>


      <!-- EVENT NAME -->

      <div class="form-group">

        <label for="eventName">

          Flood Event Name

          <span class="required">*</span>

        </label>

        <input
                type="text"
                id="eventName"
                th:field="*{eventName}"
                placeholder="Example: 2026 Kelani River Flood"
                autocomplete="off">

        <div
                class="error"
                th:if="${#fields.hasErrors('eventName')}"
                th:errors="*{eventName}">
        </div>

      </div>


      <!-- EVENT DATE -->

      <div class="form-group">

        <label for="eventDate">

          Event Date

          <span class="required">*</span>

        </label>

        <input
                type="date"
                id="eventDate"
                th:field="*{eventDate}">

        <div
                class="error"
                th:if="${#fields.hasErrors('eventDate')}"
                th:errors="*{eventDate}">
        </div>

        <div class="help-text">
          Select the date on which the flood event occurred.
        </div>

      </div>


      <!-- DESCRIPTION -->

      <div class="form-group">

        <label for="description">

          Flood Event Description

          <span class="required">*</span>

        </label>

        <textarea
                id="description"
                th:field="*{description}"
                placeholder="Enter important information about the flood event..."></textarea>

        <div
                class="error"
                th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}">
        </div>

        <div class="help-text">
          Include information such as the nature,
          severity, or general impact of the flood.
        </div>

      </div>


      <!-- ================= BUTTONS ================= -->

      <div class="button-area">

        <button
                type="submit"
                class="btn btn-primary">

          Create Flood Event

        </button>


        <a
                class="btn btn-secondary"
                th:href="@{/disasters}">

          View Flood Events

        </a>

      </div>

    </form>



    </div>

  </div>

</main>

</body>

</html>
