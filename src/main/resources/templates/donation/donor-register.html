<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration</title>
</head>
<body>

<h1>Donor Registration</h1>

<div th:if="${error}">
    <p th:text="${error}"></p>
</div>

<form th:action="@{/donors/register}" th:object="${donor}" method="post">

    <div>
        <label>Username:</label>
        <input type="text" th:field="*{username}">
        <p th:if="${#fields.hasErrors('username')}"
           th:errors="*{username}"></p>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}">
        <p th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>
    </div>

    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}">
        <p th:if="${#fields.hasErrors('fullName')}"
           th:errors="*{fullName}"></p>
    </div>

    <div>
        <label>Contact Number:</label>
        <input type="text" th:field="*{contactNumber}">
        <p th:if="${#fields.hasErrors('contactNumber')}"
           th:errors="*{contactNumber}"></p>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}">
        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label>Address:</label>
        <textarea th:field="*{address}"></textarea>
    </div>

    <button type="submit">Register Donor</button>

</form>

</body>
</html>
