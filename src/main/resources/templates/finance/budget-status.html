<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budget Status</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #abc5ec;
            color: #0e2943;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 40px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
            color: #1f2937;
        }

        .back-btn {
            text-decoration: none;
            background: #122343;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #7b8abc;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            background: #1e3c63;
            color: white;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            font-size: 14px;
            font-weight: 600;
        }

        td {
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        /* STATUS */

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ACTIONS */

        .actions-cell {
            white-space: nowrap;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 7px 14px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
        }

        .edit-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .no-action {
            color: #9ca3af;
            font-size: 18px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 768px) {

            .container {
                width: 98%;
                margin: 20px auto;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <h1> 💰 Budget Status</h1>

        <a href="/finance/dashboard"
           class="back-btn">
            Back to Dashboard
        </a>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>Budget ID</th>

                <th>Activity</th>

                <th>Requested Amount</th>

                <th>Reason</th>

                <th>Allocated Amount</th>

                <th>Status</th>

                <th>Allocated Date</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody>

            <!-- IMPORTANT:
                 budget is created here.
                 Everything using budget.status or budget.id
                 must be inside this loop.
            -->

            <tr th:each="budget : ${budgets}">

                <!-- BUDGET ID -->

                <td th:text="${budget.id}">
                    1
                </td>


                <!-- ACTIVITY -->

                <td th:text="${budget.activity}">
                    Activity
                </td>


                <!-- REQUESTED AMOUNT -->

                <td th:text="${budget.requestedAmount}">
                    0.00
                </td>


                <!-- REASON -->

                <td th:text="${budget.reason}">
                    Reason
                </td>


                <!-- ALLOCATED AMOUNT -->

                <td th:text="${budget.allocatedAmount}">
                    0.00
                </td>


                <!-- STATUS -->

                <td>

                    <span
                            th:if="${'PENDING'.equalsIgnoreCase(budget.status)}"
                            class="status status-pending">

                        Pending

                    </span>


                    <span
                            th:if="${'APPROVED'.equalsIgnoreCase(budget.status)}"
                            class="status status-approved">

                        Approved

                    </span>


                    <span
                            th:if="${'REJECTED'.equalsIgnoreCase(budget.status)}"
                            class="status status-rejected">

                        Rejected

                    </span>


                    <!-- For any other status -->

                    <span
                            th:if="${budget.status != null
                                    and budget.status != 'PENDING'
                                    and budget.status != 'APPROVED'
                                    and budget.status != 'REJECTED'}"
                            th:text="${budget.status}"
                            class="status">

                    </span>

                </td>


                <!-- ALLOCATED DATE -->

                <td th:text="${budget.allocatedDate}">
                    -
                </td>


                <!-- ACTIONS -->

                <td class="actions-cell">

                    <!-- ONLY PENDING BUDGETS CAN BE EDITED/DELETED -->

                    <div
                            th:if="${budget.status != null
                                    and 'PENDING'.equalsIgnoreCase(budget.status)}"
                            class="action-buttons">

                        <!-- EDIT -->

                        <a
                                th:href="@{/finance/budgets/edit/{id}(id=${budget.id})}"
                                class="edit-btn">

                            Edit

                        </a>


                        <!-- DELETE -->

                        <form
                                th:action="@{/finance/budgets/delete/{id}(id=${budget.id})}"
                                method="post"
                                style="display:inline;">

                            <button
                                    type="submit"
                                    class="delete-btn"
                                    onclick="return confirm('Are you sure you want to delete this pending budget?');">

                                Delete

                            </button>

                        </form>

                    </div>


                    <!-- NO ACTION FOR APPROVED / REJECTED -->

                    <span
                            th:if="${budget.status == null
                                    or !'PENDING'.equalsIgnoreCase(budget.status)}"
                            class="no-action">

                        —

                    </span>

                </td>

            </tr>


            <!-- NO BUDGETS -->

            <tr th:if="${#lists.isEmpty(budgets)}">

                <td colspan="8"
                    class="empty-message">

                    No budget records found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
