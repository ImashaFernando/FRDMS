<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense | FRDMS</title>

    <link rel="stylesheet" th:href="@{/css/edit-expense.css}">
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">F</div>

        <div>
            <h1>FRDMS</h1>
            <span>Finance Management</span>
        </div>

    </div>

    <a href="/finance/expenses" class="back-btn">
        ← Expense Records
    </a>

</header>


<main class="page-container">

    <div class="page-heading">

        <span class="eyebrow">
            FINANCE OFFICER
        </span>

        <h2>Edit Expense</h2>

        <p>
            Update the details of the selected expense record.
        </p>

    </div>


    <section class="form-card">

        <div class="record-id">

            Expense ID:

            <strong th:text="${expense.id}">
                1
            </strong>

        </div>


        <form th:action="@{/finance/expenses/update/{id}(id=${expense.id})}"
              th:object="${expense}"
              method="post"
              id="editExpenseForm">


            <div class="form-grid">


                <!-- DATE -->

                <div class="form-group">

                    <label for="expenseDate">
                        Expense Date <span>*</span>
                    </label>

                    <input type="date"
                           id="expenseDate"
                           th:field="*{expenseDate}"
                           required>

                    <small class="error"
                           th:if="${#fields.hasErrors('expenseDate')}"
                           th:errors="*{expenseDate}">
                    </small>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        Amount (LKR) <span>*</span>
                    </label>

                    <input type="number"
                           id="amount"
                           th:field="*{amount}"
                           min="0.01"
                           step="0.01"
                           required>

                    <small class="error"
                           th:if="${#fields.hasErrors('amount')}"
                           th:errors="*{amount}">
                    </small>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full-width">

                    <label for="description">
                        Expense Description <span>*</span>
                    </label>

                    <input type="text"
                           id="description"
                           th:field="*{description}"
                           maxlength="255"
                           required>

                    <small class="error"
                           th:if="${#fields.hasErrors('description')}"
                           th:errors="*{description}">
                    </small>

                </div>


                <!-- CATEGORY -->

                <div class="form-group full-width">

                    <label for="category">
                        Expense Category <span>*</span>
                    </label>

                    <select id="category"
                            th:field="*{category}"
                            required>

                        <option value="">
                            Select category
                        </option>

                        <option value="FOOD">
                            Food &amp; Water
                        </option>

                        <option value="MEDICAL">
                            Medical Supplies
                        </option>

                        <option value="TRANSPORT">
                            Transportation
                        </option>

                        <option value="SHELTER">
                            Shelter Support
                        </option>

                        <option value="RELIEF_ITEMS">
                            Relief Items
                        </option>

                        <option value="LOGISTICS">
                            Logistics
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>

                    <small class="error"
                           th:if="${#fields.hasErrors('category')}"
                           th:errors="*{category}">
                    </small>

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a href="/finance/expenses"
                   class="cancel-btn">

                    Cancel

                </a>

                <button type="submit"
                        class="update-btn">

                    Update Expense

                </button>

            </div>


        </form>

    </section>

</main>


<script th:src="@{/js/edit-expense.js}">
</script>

</body>

</html>
